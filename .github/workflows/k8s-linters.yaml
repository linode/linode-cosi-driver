name: k8s-linters

on:
  merge_group:
  pull_request:
    branches: ["*"]
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  chart-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true
      - uses: helm/chart-testing-action@v2
      - run: |
          ct lint --target-branch ${{ github.event.repository.default_branch }}

  kube-linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: go kube-linter github:norwoodj/helm-docs go:github.com/losisin/helm-values-schema-json/v2
      - run: |
          mise run lint-manifests
      - run: |
          mise run generate
          make diff
