---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: generic-test
spec:
  template: true
  steps:
  - name: Check if COSI Controller exist
    try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: container-object-storage-controller
            namespace: container-object-storage-system
          status:
            availableReplicas: 1
  - name: Create test BucketClass and BucketAccessClass
    try:
    - apply:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketClass
          metadata:
            name: ($namespace)
          driverName: objectstorage.cosi.linode.com
          deletionPolicy: Delete
          parameters:
            cosi.linode.com/v1/region: us-ord
            cosi.linode.com/v1/acl: private
            cosi.linode.com/v1/cors: disabled
    - apply:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketAccessClass
          metadata:
            name: ($namespace)
          driverName: objectstorage.cosi.linode.com
          authenticationType: Key
          parameters:
            cosi.linode.com/v1/permissions: read_only
  - name: Create BucketClaim
    try:
    - apply:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketClaim
          metadata:
            name: ($namespace)
          spec:
            bucketClassName: ($namespace)
            protocols: ["S3"]
  - name: Check if BucketClaim is ready
    timeouts:
      assert: 600s
    try:
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketClaim
          metadata:
            name: ($namespace)
          status:
            bucketReady: true
  - name: Create BucketAccess
    try:
    - apply:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketAccess
          metadata:
            name: ($namespace)
          spec:
            bucketClaimName: ($namespace)
            protocol: S3
            bucketAccessClassName: ($namespace)
            credentialsSecretName: ($namespace)
            serviceAccountName: ($namespace)
  - name: Check if BucketAccess is granted
    try:
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha1
          kind: BucketAccess
          metadata:
            name: ($namespace)
          status:
            accessGranted: true
  - name: Check if Secret exists
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ($namespace)
  - name: Validate the BucketInfo secret against its schema
    try:
    - script:
        env:
        - name: SECRET
          value: ($namespace)
        content: |
          kubectl get secret "${SECRET}" \
            --namespace "${NAMESPACE}" \
            --output jsonpath='{.data.BucketInfo}' \
            | base64 -d \
            | check-jsonschema --schemafile bucketinfo.schema.json -
