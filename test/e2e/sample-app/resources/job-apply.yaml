apiVersion: batch/v1
kind: Job
metadata:
  name: cosi-sample-upload
spec:
  template:
    spec:
      containers:
      - name: mc
        image: minio/mc:latest
        env:
        - name: BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: mc-config
              key: BUCKET_NAME
        command:
        - /bin/sh
        - -c
        - |
           set -eu
           # mc needs a writable config dir, so the read-only Secret mount
           # cannot serve as one directly.
           mkdir -p /root/.mc
           cp /mc-config/config.json /root/.mc/config.json

           for attempt in $(seq 1 24); do
             if mc ls "cosi/${BUCKET_NAME}" >/dev/null 2>&1; then
               break
             fi
             echo "waiting for bucket ${BUCKET_NAME} to be reachable over s3 (${attempt}/24)"
             sleep 5
           done

           for attempt in $(seq 1 12); do
             if date | mc pipe "cosi/${BUCKET_NAME}/test.txt"; then
               mc rm "cosi/${BUCKET_NAME}/test.txt"
               exit 0
             fi
             echo "upload failed for bucket ${BUCKET_NAME} (${attempt}/12), retrying"
             sleep 5
           done

           echo "upload failed for bucket ${BUCKET_NAME} after retries" >&2
           exit 1
        volumeMounts:
        - name: mc-config
          mountPath: /mc-config
          readOnly: true
      volumes:
      - name: mc-config
        secret:
          secretName: mc-config
      restartPolicy: Never
  backoffLimit: 1
