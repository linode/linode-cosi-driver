apiVersion: batch/v1
kind: Job
metadata:
  name: cosi-sample-upload
spec:
  template:
    spec:
      containers:
      - name: aws-cli
        image: amazon/aws-cli:2.27.41
        envFrom:
        - secretRef:
            name: aws-cli-config
        command:
        - /bin/sh
        - -c
        - |
           set -eu
           aws configure set default.s3.addressing_style path
           for attempt in $(seq 1 24); do
             if aws s3api head-bucket --bucket "${BUCKET_NAME}" >/dev/null 2>&1; then
               break
             fi
             echo "waiting for bucket ${BUCKET_NAME} to be reachable over s3 (${attempt}/24)"
             sleep 5
           done

           for attempt in $(seq 1 12); do
             if date | aws s3 cp - "s3://${BUCKET_NAME}/test.txt"; then
               aws s3 rm "s3://${BUCKET_NAME}/test.txt"
               exit 0
             fi
             echo "upload failed for bucket ${BUCKET_NAME} (${attempt}/12), retrying"
             sleep 5
           done

           echo "upload failed for bucket ${BUCKET_NAME} after retries" >&2
           exit 1
      restartPolicy: Never
  backoffLimit: 1
