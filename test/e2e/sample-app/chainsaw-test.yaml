---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sample-app
spec:
  template: true
  steps:

  - name: Check if COSI Controller exist
    try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: container-object-storage-controller
            namespace: container-object-storage-system
          status:
            availableReplicas: 1

  - name: Create test BucketClass and BucketAccessClass
    try:
    - apply:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha2
          kind: BucketClass
          metadata:
            name: ($namespace)
          spec:
            driverName: objectstorage.cosi.linode.com
            deletionPolicy: Delete
            parameters:
              cosi.linode.com/v1/region: us-ord
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha2
          kind: BucketClass
          metadata:
            name: ($namespace)
    - apply:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha2
          kind: BucketAccessClass
          metadata:
            name: ($namespace)
          spec:
            driverName: objectstorage.cosi.linode.com
            authenticationType: Key
    - assert:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha2
          kind: BucketAccessClass
          metadata:
            name: ($namespace)

  - name: Create BucketClaim
    try:
    - apply:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha2
          kind: BucketClaim
          metadata:
            name: cosi-sample-app
          spec:
            bucketClassName: ($namespace)
            protocols:
            - S3

  - name: Check if BucketClaim is ready
    timeouts:
      assert: 600s
    try:
    - assert:
        file: ./resources/bucketclaim-assert.yaml

  - name: Create BucketAccess
    try:
    - apply:
        resource:
          apiVersion: objectstorage.k8s.io/v1alpha2
          kind: BucketAccess
          metadata:
            name: cosi-sample-app
          spec:
            bucketAccessClassName: ($namespace)
            bucketClaims:
              - bucketClaimName: cosi-sample-app
                accessSecretName: s3-credentials
                accessModes:
                  objectData: ReadWrite
            protocol: S3
    - assert:
        file: ./resources/bucketaccess-assert.yaml
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: s3-credentials

  - name: Build the AWS CLI configuration from the COSI Secret
    try:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -eu
          read_cosi_value() {
            kubectl get secret s3-credentials --namespace "${NAMESPACE}" \
              --output "jsonpath={.data.${1}}" | base64 -d
          }
          endpoint="$(read_cosi_value COSI_S3_ENDPOINT)"
          region="$(read_cosi_value COSI_S3_REGION)"
          access_key_id="$(read_cosi_value COSI_S3_ACCESS_KEY_ID)"
          access_secret_key="$(read_cosi_value COSI_S3_ACCESS_SECRET_KEY)"
          bucket="$(read_cosi_value COSI_S3_BUCKET_ID)"

          kubectl create secret generic aws-cli-config \
            --namespace "${NAMESPACE}" \
            --from-literal=AWS_ACCESS_KEY_ID="${access_key_id}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${access_secret_key}" \
            --from-literal=AWS_DEFAULT_REGION="${region}" \
            --from-literal=AWS_ENDPOINT_URL="https://${endpoint}" \
            --from-literal=BUCKET_NAME="${bucket}"

  - name: Run test upload
    timeouts:
      assert: 300s
    try:
    - apply:
        file: ./resources/job-apply.yaml
    - assert:
        file: ./resources/job-assert.yaml
    catch:
      - podLogs:
          selector: job-name=cosi-sample-upload
